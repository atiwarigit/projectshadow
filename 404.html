<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060a12">
<title>Not found — Kind Shadow Club</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root{--ink:#060a12;--kraft:#c69a5f;--text:#e8e3d5;--muted:#8a96aa;--disp:'Oswald',Impact,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--text);text-align:center;padding:32px;font-family:var(--mono)}
  h1{font-family:var(--disp);text-transform:uppercase;font-size:clamp(36px,7vw,72px);letter-spacing:.02em;margin:0 0 16px}
  p{color:var(--muted);max-width:36ch;line-height:1.6}
  a{color:var(--ink);background:var(--kraft);text-decoration:none;display:inline-block;margin-top:28px;padding:14px 22px;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
</style>
</head>
<body>
  <main>
    <h1>Wrong porch.</h1>
    <p>This door doesn't open. The club is still on the other side.</p>
    <a href="./">Back to Kind Shadow Club</a>
  </main>
</body>
</html>
